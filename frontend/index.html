<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171717" />
    <script>
      // Тема до загрузки React: без вспышки тёмного фона на светлой теме.
      try {
        var stored = localStorage.getItem('vetassistant.theme')
        var mode =
          stored === 'light' || stored === 'dark' || stored === 'system'
            ? stored
            : 'dark'
        var dark =
          mode === 'system'
            ? window.matchMedia('(prefers-color-scheme: dark)').matches
            : mode === 'dark'
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      } catch (error) {}
    </script>
    <meta
      name="description"
      content="VetAssistant — локальный ИИ-ветеринар: чат с RAG, запись на приём и напоминания."
    />
    <title>VetAssistant — ИИ-ветеринар</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
