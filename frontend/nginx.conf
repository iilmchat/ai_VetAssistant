# HTTP-сервер фронтенда. В production именно он принимает трафик на :80
# (см. docker-compose.prod.yml), а HTTPS добавляется через
# deploy/nginx/ssl.conf и docker-compose.ssl.yml.
#
# Location'ы /api/, SPA и ACME продублированы в deploy/nginx/ssl.conf:
# держите их синхронными при изменениях.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Healthcheck для Docker Compose и внешнего мониторинга.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ACME webroot для Let's Encrypt: certbot кладёт файл в
    # ./deploy/certbot/www, а Nginx отдаёт его по HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        access_log off;
    }

    # API и SSE: /api/v1/chat/completions -> http://api:8000/v1/chat/completions
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_redirect off;

        # Не буферизуем SSE, иначе текст придёт одним куском.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # Хэшированные ассеты Vite можно кэшировать надолго.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: любой клиентский маршрут отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
