# HTTP-сервер лендинга. TLS терминирует Caddy на edge-хосте,
# лендинг доступен только по внутренней сети Docker `edge`.
#
# Cache-Control задаётся через map на уровне http-контекста (файл
# подключается из conf.d), чтобы не дублировать security-заголовки
# внутри location: add_header в location отменяет наследование.

map $uri $cache_control {
    default                                      "no-cache";
    ~*\.(?:css|js|woff2)$                        "public, max-age=31536000, immutable";
    ~*\.(?:png|jpe?g|webp|avif|svg|ico)$         "public, max-age=2592000";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~* \.(?:css|js|woff2|png|jpe?g|webp|avif|svg|ico)$ {
        try_files $uri =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
