# Фрагмент для services: в docker-compose.edge.yml (проект vetassistant).
# Вставить после сервиса frontend. Ничего не применять до готовности Пакета A.
#
# Сервис не публикует порты: Caddy ходит на vetassistant-landing:80
# по внешней сети `edge`.

  landing:
    image: nginx:stable-alpine
    container_name: vetassistant-landing
    restart: unless-stopped
    logging: *default-logging
    expose:
      - "80"
    volumes:
      - ./landing:/usr/share/nginx/html:ro
      # Конфиг nginx лежит вне web-root, чтобы не отдаваться как статика.
      - ./docs/landing/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - edge
