# HTTP-сервер в режиме HTTPS: ACME-челленджи и healthcheck обслуживаются,
# остальное перенаправляется на HTTPS. Этот блок становится default_server
# только при подключении overlay; без него работает обычный frontend/nginx.conf.
server {
    listen 80 default_server;

    # Certbot webroot должен быть доступен по HTTP и после включения HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        access_log off;
    }

    # Docker healthcheck ходит на http://127.0.0.1/healthz.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS-сервер. Подключается только вместе с docker-compose.ssl.yml:
#   docker compose -f docker-compose.prod.yml -f docker-compose.ssl.yml up -d
#
# Сертификат выпускается Certbot с фиксированным именем `vetassistant`:
#   --cert-name vetassistant
# Поэтому путь ниже не зависит от домена. Каталог ./deploy/certbot/conf
# монтируется в /etc/letsencrypt (см. docker-compose.ssl.yml).
#
# Location'ы /api/, SPA и ACME синхронизированы с frontend/nginx.conf.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/vetassistant/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vetassistant/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Healthcheck (в HTTPS-режиме HTTP /healthz отвечает 200, но оставляем и тут).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Certbot webroot на случай проверки по HTTPS/ручной диагностики.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        access_log off;
    }

    # API и SSE: /api/v1/chat/completions -> http://api:8000/v1/chat/completions
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Connection "";
        proxy_redirect off;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 10s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
