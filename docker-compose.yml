name: vetassistant

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  image: vetassistant:1.0.0
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    container_name: vetassistant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vetassistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vetassistant}
      POSTGRES_DB: ${POSTGRES_DB:-vetassistant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-vetassistant} -d ${POSTGRES_DB:-vetassistant}"
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *app
    container_name: vetassistant-api
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Модель GGUF и ChromaDB берутся с хоста, а не копируются в образ.
      - ./data:/app/data
    environment:
      VET_API_MODEL_PATH: ${VET_API_MODEL_PATH:-/app/data/gguf/qwen3-8b-vet-Q4_K_M.gguf}
      VET_API_MODEL_ID: ${VET_API_MODEL_ID:-qwen3-8b-vet}
      VET_API_N_CTX: ${VET_API_N_CTX:-8192}
      VET_API_N_GPU_LAYERS: ${VET_API_N_GPU_LAYERS:-0}
      VET_API_CHROMA_DIR: ${VET_API_CHROMA_DIR:-/app/data/chroma_db}
      VET_API_CHROMA_COLLECTION: ${VET_API_CHROMA_COLLECTION:-msd_vet_manual}
      VET_API_EMBEDDING_MODEL: ${VET_API_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      VET_API_RAG_TOP_K: ${VET_API_RAG_TOP_K:-3}
      VET_API_DATABASE_URL: ${VET_API_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-vetassistant}:${POSTGRES_PASSWORD:-vetassistant}@db:5432/${POSTGRES_DB:-vetassistant}}
      VET_API_JWT_SECRET: ${VET_API_JWT_SECRET:-dev-insecure-jwt-secret-change-me}
      VET_API_ACCESS_TOKEN_EXPIRE_MINUTES: ${VET_API_ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ui:
    <<: *app
    container_name: vetassistant-ui
    command:
      - streamlit
      - run
      - app/ui.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    environment:
      # Внутри compose UI обращается к API по имени сервиса, а не localhost.
      VET_UI_API_URL: ${VET_UI_API_URL:-http://api:8000/v1/chat/completions}
      VET_UI_MODEL_ID: ${VET_UI_MODEL_ID:-qwen3-8b-vet}
      VET_UI_TIMEOUT_S: ${VET_UI_TIMEOUT_S:-300}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # В браузере запросы идут на тот же origin, Nginx проксирует /api.
        VITE_API_BASE_URL: ${VITE_FRONTEND_API_BASE_URL:-/api}
        VITE_MODEL_ID: ${VET_API_MODEL_ID:-qwen3-8b-vet}
    image: vetassistant-frontend:1.0.0
    container_name: vetassistant-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - "http://127.0.0.1/healthz"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    <<: *app
    container_name: vetassistant-bot
    command:
      - python
      - -m
      - bot
    depends_on:
      api:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      VET_BOT_API_URL: ${VET_BOT_API_URL:-http://api:8000/v1/chat/completions}
      VET_BOT_MODEL_ID: ${VET_BOT_MODEL_ID:-qwen3-8b-vet}
      VET_BOT_TIMEOUT_S: ${VET_BOT_TIMEOUT_S:-300}
      VET_BOT_TEMPERATURE: ${VET_BOT_TEMPERATURE:-0.7}
      VET_BOT_USE_RAG: ${VET_BOT_USE_RAG:-true}
      VET_BOT_USE_TOOLS: ${VET_BOT_USE_TOOLS:-true}
      VET_BOT_MAX_HISTORY_MESSAGES: ${VET_BOT_MAX_HISTORY_MESSAGES:-20}
      VET_BOT_AUTH_SECRET: ${VET_BOT_AUTH_SECRET:-}
    restart: "no"

volumes:
  postgres_data:
