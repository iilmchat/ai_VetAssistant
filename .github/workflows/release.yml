name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker image
        run: docker build -t "vetassistant:${GITHUB_REF_NAME}" .

      - name: Build frontend Docker image
        run: docker build -t "vetassistant-frontend:${GITHUB_REF_NAME}" ./frontend

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VetAssistant ${{ github.ref_name }}
          body_path: docs/CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: false
