name: Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

# T-130: образы собираются только в deploy.yml. Тег `v*` раньше запускал
# docker build и в release.yml, и в deploy.yml — двойная нагрузка на VPS
# и лишние 20–30 минут. Здесь остаётся только создание GitHub Release.
jobs:
  create-release:
    name: Create GitHub Release
    runs-on: [self-hosted, linux, x64, vps]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VetAssistant ${{ github.ref_name }}
          body_path: docs/CHANGELOG.md
          draft: false
          prerelease: false
          generate_release_notes: false

  android-release:
    name: Android Release Asset
    # Пока секреты подписи не заданы, job быстро завершается без сборки.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SIGNING_ENABLED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        if: ${{ env.ANDROID_SIGNING_ENABLED == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: ${{ env.ANDROID_SIGNING_ENABLED == 'true' }}
        run: npm ci
        working-directory: frontend

      - name: Build web assets and sync Capacitor
        if: ${{ env.ANDROID_SIGNING_ENABLED == 'true' }}
        run: |
          npm run build
          npx cap sync android
        working-directory: frontend

      - name: Set up JDK 21
        if: ${{ env.ANDROID_SIGNING_ENABLED == 'true' }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK platform 36
        if: ${{ env.ANDROID_SIGNING_ENABLED == 'true' }}
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode signing keystore
        if: ${{ env.ANDROID_SIGNING_ENABLED == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/android"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android/vetassistant.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/android/vetassistant.keystore" >> "$GITHUB_ENV"

      - name: Build signed AAB/APK
        if: ${{ env.ANDROID_SIGNING_ENABLED == 'true' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
        run: bash ./gradlew bundleRelease assembleRelease --no-daemon
        working-directory: frontend/android

      - name: Attach Android assets to Release
        if: ${{ env.ANDROID_SIGNING_ENABLED == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            frontend/android/app/build/outputs/bundle/release/*.aab
            frontend/android/app/build/outputs/apk/release/*.apk
