name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint & Test
    # Self-hosted runner имеет доступ к Docker и production-каталогу:
    # не выполняем код из форков, только push в main и PR этого репозитория.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, vps]
    # T-146: жёсткий лимит, чтобы зависший job не держал раннер.
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # T-146: без `cache: pip` — на self-hosted раннере setup-python
          # зависает на синхронизации кэша с GitHub Cache Service (18+ минут).
          # pip-кэш и так хранится локально и переживает прогоны.

      - name: Install system dependencies
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential

      - name: Install CPU PyTorch
        # Уменьшает размер и время установки: без CUDA-зависимостей.
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest pytest-asyncio ruff mypy types-passlib types-pyyaml

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy app

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, vps]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  docker-build:
    name: Docker Build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, vps]
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t vetassistant:test .

      - name: Build frontend Docker image
        run: docker build -t vetassistant-frontend:test ./frontend

  android-build:
    name: Android Build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SIGNING_ENABLED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build web assets
        run: npm run build
        working-directory: frontend

      - name: Sync Capacitor
        run: npx cap sync android
        working-directory: frontend

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: frontend/android

      - name: Decode signing keystore
        if: ${{ env.ANDROID_SIGNING_ENABLED == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/android"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android/vetassistant.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/android/vetassistant.keystore" >> "$GITHUB_ENV"

      - name: Build signed release AAB/APK
        if: ${{ env.ANDROID_SIGNING_ENABLED == 'true' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon
        working-directory: frontend/android

      - name: Upload Android artifacts
        if: ${{ env.ANDROID_SIGNING_ENABLED == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            frontend/android/app/build/outputs/bundle/release/*.aab
            frontend/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
