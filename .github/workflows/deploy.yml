name: Deploy

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Не запускаем два деплоя одновременно: второй ждёт завершения первого.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pull and rebuild on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            cd /srv/vetassistant
            git pull --ff-only
            docker compose -f docker-compose.edge.yml up -d --build
