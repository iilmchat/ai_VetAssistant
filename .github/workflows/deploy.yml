name: Deploy

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Не запускаем два деплоя одновременно: второй ждёт завершения первого.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: [self-hosted, linux, x64, vps]
    timeout-minutes: 90
    steps:
      # T-131: версия образа берётся из тега (`v1.5.5` -> `1.5.5`), поэтому
      # в `docker ps` видно, какая сборка реально запущена на сервере.
      - name: Resolve image version from tag
        id: version
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "Deploying image version: ${GITHUB_REF_NAME#v}"

      # T-132: версия должна переживать ручной `docker compose up` и ребут.
      # Пишем её в .env сервера идемпотентно: повторные деплои не плодят
      # дубликаты строк, а compose читает значение из файла сам.
      - name: Persist image version to .env
        env:
          VETASSISTANT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd /srv/vetassistant
          if grep -q '^VETASSISTANT_VERSION=' .env; then
            sed -i "s|^VETASSISTANT_VERSION=.*|VETASSISTANT_VERSION=${VETASSISTANT_VERSION}|" .env
          else
            printf 'VETASSISTANT_VERSION=%s\n' "${VETASSISTANT_VERSION}" >> .env
          fi
          echo "VETASSISTANT_VERSION в .env:"
          grep '^VETASSISTANT_VERSION=' .env

      - name: Pull and rebuild on server
        env:
          VETASSISTANT_VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd /srv/vetassistant
          git pull --ff-only
          # api и bot используют один image tag; собираем api/frontend по
          # отдельности, иначе параллельный export падает с "image already exists".
          docker compose -f docker-compose.edge.yml build api frontend
          docker compose -f docker-compose.edge.yml up -d --no-build
