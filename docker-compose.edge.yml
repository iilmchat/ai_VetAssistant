# Edge-стек VetAssistant для общего VPS с Caddy (T-043).
#
# Контракт инфраструктурного агента:
#   - 80/443 принадлежат Caddy, этот compose НЕ публикует порты;
#   - Caddy и сервисы VetAssistant общаются через внешнюю сеть `edge`;
#   - api и db дополнительно изолированы во внутренней сети `internal`;
#   - bot и Streamlit в production не входят.
#
# Перед запуском сеть edge должна существовать:
#   docker network inspect edge
#
# Запуск:
#   docker compose -f docker-compose.edge.yml up -d --build

name: vetassistant

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  # Версия образа приходит из тега git (T-131): deploy.yml экспортирует
  # VETASSISTANT_VERSION=${GITHUB_REF_NAME#v}, поэтому в `docker ps` видно,
  # какая именно сборка запущена. Локально без переменной — `latest`.
  image: vetassistant:${VETASSISTANT_VERSION:-latest}
  restart: unless-stopped
  logging: *default-logging

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vetassistant-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *app
    container_name: vetassistant-api
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      - --proxy-headers
      - --forwarded-allow-ips=*
    # Только внутренние сети; на хост порт не публикуется.
    expose:
      - "8000"
    mem_limit: 6g
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      # Кеш sentence-transformers/HuggingFace переживает пересоздание контейнера:
      # модель эмбеддингов не скачивается заново при каждом деплое.
      - hf_cache:/root/.cache/huggingface
    networks:
      - internal
      - edge
    environment:
      VET_API_MODEL_PATH: ${VET_API_MODEL_PATH:-/app/data/gguf/qwen3-8b-vet-Q4_K_M.gguf}
      VET_API_MODEL_ID: ${VET_API_MODEL_ID:-qwen3-8b-vet}
      VET_API_N_CTX: ${VET_API_N_CTX:-4096}
      VET_API_N_GPU_LAYERS: ${VET_API_N_GPU_LAYERS:-0}
      # T-144: GPU через обратный SSH-туннель до LM Studio; fallback на CPU.
      VET_API_GPU_BACKEND_ENABLED: ${VET_API_GPU_BACKEND_ENABLED:-false}
      VET_API_GPU_BACKEND_BASE: ${VET_API_GPU_BACKEND_BASE:-}
      VET_API_GPU_BACKEND_API_KEY: ${VET_API_GPU_BACKEND_API_KEY:-}
      VET_API_GPU_BACKEND_MODEL: ${VET_API_GPU_BACKEND_MODEL:-qwen3-8b-vet@q4_k_m}
      VET_API_GPU_BACKEND_PROBE_INTERVAL_S: ${VET_API_GPU_BACKEND_PROBE_INTERVAL_S:-15}
      VET_API_GPU_BACKEND_PROBE_TIMEOUT_S: ${VET_API_GPU_BACKEND_PROBE_TIMEOUT_S:-3}
      VET_API_GPU_BACKEND_TTFT_FALLBACK_S: ${VET_API_GPU_BACKEND_TTFT_FALLBACK_S:-8}
      VET_API_CHROMA_DIR: ${VET_API_CHROMA_DIR:-/app/data/chroma_db}
      VET_API_CHROMA_COLLECTION: ${VET_API_CHROMA_COLLECTION:-msd_vet_manual}
      VET_API_EMBEDDING_MODEL: ${VET_API_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      VET_API_RAG_TOP_K: ${VET_API_RAG_TOP_K:-3}
      # T-141: hybrid = BM25 + векторы через RRF; vector — только эмбеддинги.
      VET_API_RAG_MODE: ${VET_API_RAG_MODE:-hybrid}
      VET_API_RAG_CANDIDATES: ${VET_API_RAG_CANDIDATES:-10}
      VET_API_RAG_BM25_WEIGHT: ${VET_API_RAG_BM25_WEIGHT:-1}
      VET_API_KNOWLEDGE_DIR: ${VET_API_KNOWLEDGE_DIR:-/app/data/knowledge}
      # Индекс строится entrypoint-скриптом до старта uvicorn, чтобы модель
      # эмбеддингов не конкурировала за RAM с 8B-моделью.
      VET_API_AUTO_INGEST: ${VET_API_AUTO_INGEST:-1}
      VET_API_INGEST_STRICT: ${VET_API_INGEST_STRICT:-0}
      # T-135: Prometheus в сети edge; админская аналитика ходит сюда.
      VET_API_PROMETHEUS_URL: ${VET_API_PROMETHEUS_URL:-http://vetassistant-prometheus:9090}
      VET_API_PROMETHEUS_TIMEOUT_S: ${VET_API_PROMETHEUS_TIMEOUT_S:-2}
      HF_HOME: /root/.cache/huggingface
      VET_API_DATABASE_URL: ${VET_API_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
      VET_API_JWT_SECRET: ${VET_API_JWT_SECRET:?VET_API_JWT_SECRET is required}
      VET_API_ACCESS_TOKEN_EXPIRE_MINUTES: ${VET_API_ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      VET_API_ALLOW_PUBLIC_REGISTRATION: ${VET_API_ALLOW_PUBLIC_REGISTRATION:-false}
      # T-134: привязка Telegram и уведомления о записях/напоминаниях.
      # Токен нужен и api (sendMessage), и bot; username — для инструкции.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      VET_API_TELEGRAM_API_BASE: ${VET_BOT_TELEGRAM_API_BASE:-https://api.telegram.org}
      VET_API_TELEGRAM_NOTIFY: ${VET_API_TELEGRAM_NOTIFY:-true}
      VET_API_TELEGRAM_BOT_USERNAME: ${VET_BOT_USERNAME:-}
      VET_API_N_THREADS: ${VET_API_N_THREADS:-3}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-3}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      # Первый запуск может скачивать модель эмбеддингов и строить индекс.
      start_period: 300s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_MODEL_ID: ${VET_API_MODEL_ID:-qwen3-8b-vet}
    image: vetassistant-frontend:${VETASSISTANT_VERSION:-latest}
    container_name: vetassistant-frontend
    restart: unless-stopped
    logging: *default-logging
    # Порты не публикуются: Caddy обращается к frontend:80 по сети edge.
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - --spider
        - "http://127.0.0.1/healthz"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  bot:
    <<: *app
    container_name: vetassistant-bot
    # Docker must start the bot after a host reboot (FirstVDS maintenance).
    restart: unless-stopped
    command:
      - python
      - -m
      - bot
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge
    mem_limit: 512m
    environment:
      # Не блокируем деплой API/frontend, если секреты ещё не заданы:
      # бот завершится с понятной ошибкой (fail closed).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Закрытый доступ: бот отвечает только этим Telegram ID (через запятую).
      VET_BOT_ALLOWED_TELEGRAM_IDS: ${VET_BOT_ALLOWED_TELEGRAM_IDS:-}
      VET_BOT_API_URL: http://api:8000/v1/chat/completions
      VET_BOT_USE_RAG: ${VET_BOT_USE_RAG:-true}
      VET_BOT_USE_TOOLS: ${VET_BOT_USE_TOOLS:-true}
      VET_BOT_AUTH_SECRET: ${VET_BOT_AUTH_SECRET:-}
      # Reverse-proxy для Bot API (Cloudflare Worker), если api.telegram.org
      # заблокирован с VPS.
      VET_BOT_TELEGRAM_API_BASE: ${VET_BOT_TELEGRAM_API_BASE:-https://api.telegram.org}

networks:
  edge:
    external: true
  internal:
    internal: true

volumes:
  postgres_data:
  hf_cache:
